<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese News Sentiment Analyzer</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    >
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #263c68 0%, transparent 34rem),
                radial-gradient(circle at 0% 60%, #30204f 0%, transparent 28rem),
                #090b12;
            color: #e0e0e0;
        }

        .login-shell {
            max-width: 560px;
        }

        .dynamic-panel {
            background: linear-gradient(
                135deg,
                rgba(52, 72, 122, 0.72),
                rgba(35, 29, 68, 0.62)
            );
            border: 1px solid rgba(185, 210, 255, 0.42);
            border-radius: 28px;
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.5),
                0 0 28px rgba(86, 145, 255, 0.16);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(185, 210, 255, 0.32);
            border-radius: 999px;
            background: rgba(15, 20, 38, 0.45);
            color: #b9d2ff;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-control {
            background: rgba(5, 8, 18, 0.55);
            border-color: rgba(185, 210, 255, 0.3);
            color: #fff;
        }

        .form-control::placeholder {
            color: #a7afc2;
        }

        .form-control:focus {
            background: rgba(5, 8, 18, 0.7);
            border-color: #8ab4f8;
            box-shadow: 0 0 0 0.2rem rgba(138, 180, 248, 0.18);
            color: #fff;
        }

        .analyze-button {
            border-radius: 999px;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="login-shell w-100">
            <div class="dynamic-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="brand-pill">
                        <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                        AI Market Insight
                    </span>
                    <h1 class="display-6 fw-bold mt-4 mb-3">
                        Japanese News<br>Sentiment Analyzer
                    </h1>
                    <p class="text-light opacity-75 mb-0">
                        Analisis sentimen berita Jepang secara real-time dengan Gemini AI.
                    </p>
                </div>

                <form action="/analyze" method="POST">
                    <label for="api_key" class="form-label fw-semibold">
                        <i class="fa-solid fa-key me-2" aria-hidden="true"></i>
                        Gemini API Key
                    </label>
                    <input
                        type="password"
                        class="form-control form-control-lg mb-3"
                        id="api_key"
                        name="api_key"
                        placeholder="Masukkan Gemini API Key Anda"
                        required
                    >
                    <button type="submit" class="btn btn-primary analyze-button w-100">
                        <i class="fa-solid fa-wand-magic-sparkles me-2" aria-hidden="true"></i>
                        Analisis Berita
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
