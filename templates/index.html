<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan API Gemini</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <form action="/analyze" method="POST" class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
            <h1 class="h3 text-center mb-4">Pengaturan API Gemini</h1>

            <div class="mb-3">
                <label for="api_key" class="form-label">Gemini API Key</label>
                <input
                    type="password"
                    class="form-control"
                    id="api_key"
                    name="api_key"
                    placeholder="Masukkan Gemini API Key Anda"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">Kirim</button>
        </form>
    </main>
</body>
</html>
