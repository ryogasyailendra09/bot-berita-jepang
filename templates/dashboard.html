<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sentimen Berita Jepang</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    >
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #263c68 0%, transparent 34rem),
                radial-gradient(circle at 0% 40%, #30204f 0%, transparent 28rem),
                #090b12;
            color: #e0e0e0;
        }

        .dynamic-header {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            background: linear-gradient(
                135deg,
                rgba(52, 72, 122, 0.72),
                rgba(35, 29, 68, 0.62)
            );
            border: 1px solid rgba(185, 210, 255, 0.42);
            border-radius: 999px;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.55),
                0 0 24px rgba(86, 145, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .dynamic-header h1 {
            margin: 0;
            font-size: clamp(1rem, 3vw, 1.35rem);
            letter-spacing: 0.02em;
        }

        .news-card {
            height: 100%;
            background: linear-gradient(
                145deg,
                rgba(31, 48, 82, 0.78),
                rgba(27, 24, 52, 0.7)
            );
            border: 1px solid rgba(185, 210, 255, 0.26);
            border-radius: 20px;
            color: #e0e0e0;
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease,
                opacity 0.25s ease;
        }

        .news-card:hover {
            border-color: rgba(185, 210, 255, 0.55);
            box-shadow:
                0 16px 34px rgba(0, 0, 0, 0.48),
                0 0 22px rgba(86, 145, 255, 0.15);
            transform: translateY(-4px);
        }

        .news-grid:has(.news-card:hover) .news-card:not(:hover) {
            filter: blur(5px);
            opacity: 0.42;
            transform: scale(0.98);
        }

        .news-card:hover {
            position: relative;
            z-index: 1;
        }

        .news-card .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .news-card .card-body {
            padding: 1.5rem;
        }

        .news-card .btn {
            border-radius: 999px;
            font-size: 0.9rem;
            padding: 0.65rem 1rem;
        }
    </style>
</head>
<body>
    <main class="container py-4 py-md-5">
        <header class="dynamic-header mb-5 text-center">
            <h1 class="fw-bold">
                <i class="fa-solid fa-newspaper me-2" aria-hidden="true"></i>
                Dashboard Sentimen Berita Jepang
            </h1>
        </header>

        <div class="row row-cols-1 row-cols-md-3 g-4 news-grid">
            {% for item in berita %}
            <div class="col">
                <article class="card news-card shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ item.judul }}</h5>
                        <div class="mt-3">
                            {% if item.sentimen == "Positif" %}
                                <span class="badge text-bg-success">
                                    <i class="fa-solid fa-arrow-trend-up me-1" aria-hidden="true"></i>
                                    Positif
                                </span>
                            {% elif item.sentimen == "Negatif" %}
                                <span class="badge text-bg-danger">
                                    <i class="fa-solid fa-arrow-trend-down me-1" aria-hidden="true"></i>
                                    Negatif
                                </span>
                            {% elif item.sentimen == "Gagal Diproses (Server Sibuk)" %}
                                <span class="badge text-bg-warning">
                                    <i class="fa-solid fa-triangle-exclamation me-1" aria-hidden="true"></i>
                                    Gagal
                                </span>
                            {% else %}
                                <span class="badge text-bg-secondary">
                                    <i class="fa-solid fa-minus me-1" aria-hidden="true"></i>
                                    Netral
                                </span>
                            {% endif %}
                        </div>
                        <div class="mt-auto">
                            <a
                                href="{{ item.link }}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn btn-outline-light w-100 mt-4"
                            >
                                <i class="fa-solid fa-arrow-up-right-from-square me-1" aria-hidden="true"></i>
                                Baca Artikel Asli
                            </a>
                        </div>
                    </div>
                </article>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
